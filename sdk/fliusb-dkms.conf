# DKMS configuration for FLI's out-of-tree fliusb USB driver.
#
# Copied to /usr/src/fliusb-<version>/dkms.conf by install_fliusb_dkms.sh.
# With this registered, dkms rebuilds fliusb against every newly installed
# kernel, so a kernel upgrade does not silently leave the camera without a
# /dev/fliusb* node.
#
# KDIR is passed explicitly because the vendor Makefile defaults it to
# `uname -r` — that is the *running* kernel, which is the wrong target when
# dkms is building for a kernel that has just been installed but not booted.

PACKAGE_NAME="fliusb"
PACKAGE_VERSION="1.5"

MAKE[0]="make KDIR=${kernel_source_dir} module"
CLEAN="make KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="fliusb"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/misc"

# Rebuild automatically on kernel install rather than waiting to be asked.
AUTOINSTALL="yes"
